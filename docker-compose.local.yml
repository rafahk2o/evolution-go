services:
  postgres:
    image: postgres:15-alpine
    container_name: evolution-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - evolution_postgres_local:/var/lib/postgresql/data

  evolution-go:
    image: evolution-go-local:chatwoot
    container_name: evolution-go-local
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      CLIENT_NAME: evolution
      GLOBAL_API_KEY: 429683C4C977415CAAFCCE10F7D57E11
      POSTGRES_AUTH_DB: postgresql://postgres:postgres@postgres:5432/evogo_auth?sslmode=disable
      POSTGRES_USERS_DB: postgresql://postgres:postgres@postgres:5432/evogo_users?sslmode=disable
      DATABASE_SAVE_MESSAGES: "false"
      LOGTYPE: console
      WADEBUG: INFO
      WEBHOOK_FILES: "true"
      CONNECT_ON_STARTUP: "false"
      OS_NAME: "Evolution GO"
      WEBHOOK_URL: ""
      AMQP_URL: ""
      AMQP_GLOBAL_ENABLED: "false"
      NATS_URL: ""
      NATS_GLOBAL_ENABLED: "false"
      MINIO_ENABLED: "false"
      EVENT_IGNORE_GROUP: "false"
      EVENT_IGNORE_STATUS: "true"
      QRCODE_MAX_COUNT: "5"
    depends_on:
      - postgres

volumes:
  evolution_postgres_local:
