<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evolution GO WACalls</title>
  <link rel="stylesheet" href="call-window.css">
</head>
<body>
  <main class="shell">
    <header class="brand">
      <div class="brand-icon" aria-hidden="true">☎</div>
      <div>
        <h1>Evolution GO</h1>
        <p>Chamadas WhatsApp</p>
      </div>
      <button class="icon-button" type="button" data-action="settings" aria-label="Configurações" title="Configurações">⚙</button>
    </header>

    <section id="setupPanel" class="panel">
      <h2>Conectar API</h2>
      <p class="intro">Informe os dados da instância uma única vez.</p>
      <form>
        <div class="field">
          <label for="apiUrl">URL da API</label>
          <input id="apiUrl" name="apiUrl" type="url" autocomplete="url" placeholder="https://evolution.exemplo.com" required>
        </div>
        <div class="field">
          <label for="apiKey">API key</label>
          <input id="apiKey" name="apiKey" type="password" autocomplete="off" placeholder="Cole a chave da instância" required>
        </div>
        <button class="button primary full" type="submit" data-action="save">Salvar e testar</button>
      </form>
      <p class="hint">A chave fica salva somente neste navegador.</p>
    </section>

    <section id="dialerPanel" class="panel" hidden>
      <div class="instance-row">
        <span class="online-dot" aria-hidden="true"></span>
        <span id="instanceName">Instância conectada</span>
      </div>
      <div class="field dial-field">
        <label for="phone">Telefone com DDI e DDD</label>
        <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="55 11 99999-9999">
      </div>
      <button class="button primary call-button" type="button" data-action="call">
        <span aria-hidden="true">☎</span> Ligar
      </button>
    </section>

    <section id="activePanel" class="panel active-call" hidden>
      <div class="call-avatar" aria-hidden="true">☎</div>
      <p id="callNumber" class="call-number"></p>
      <p id="callStatus" class="call-status">Preparando</p>
      <p id="duration" class="duration">00:00</p>
      <div class="call-actions">
        <button class="round-button" type="button" data-action="mute"><span aria-hidden="true">🎙</span><span id="muteLabel">Silenciar</span></button>
        <button class="round-button danger" type="button" data-action="end"><span aria-hidden="true">☎</span><span>Encerrar</span></button>
      </div>
    </section>

    <div id="message" class="message" role="status" aria-live="polite"></div>
  </main>
  <script src="shared/core.js"></script>
  <script src="shared/protocol.js"></script>
  <script src="call-controller.js"></script>
  <script src="call-window.js"></script>
</body>
</html>
