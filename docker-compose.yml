services:
  postgres:
    image: postgres:15-alpine
    container_name: evolution-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - evolution_postgres_local:/var/lib/postgresql/data

  evolution-go:
    build:
      context: .
      dockerfile: Dockerfile
    image: evolution-go-local:wacalls
    container_name: evolution-go-local
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "${WEBRTC_UDP_PORT:-50000}:${WEBRTC_UDP_PORT:-50000}/udp"
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      SERVER_PORT: 8080
      CLIENT_NAME: evolution
      POSTGRES_AUTH_DB: postgresql://postgres:postgres@postgres:5432/evogo_auth?sslmode=disable
      POSTGRES_USERS_DB: postgresql://postgres:postgres@postgres:5432/evogo_users?sslmode=disable
      DATABASE_SAVE_MESSAGES: "false"
      LOGTYPE: console
      WADEBUG: INFO
      WEBHOOK_FILES: "true"
      CONNECT_ON_STARTUP: "false"
      OS_NAME: "Evolution GO"
      WEBHOOK_URL: ""
      AMQP_URL: ""
      AMQP_GLOBAL_ENABLED: "false"
      NATS_URL: ""
      NATS_GLOBAL_ENABLED: "false"
      MINIO_ENABLED: "false"
      EVENT_IGNORE_GROUP: "false"
      EVENT_IGNORE_STATUS: "true"
      QRCODE_MAX_COUNT: "5"
      WEBRTC_PUBLIC_IP: ${WEBRTC_PUBLIC_IP:?Set WEBRTC_PUBLIC_IP to the server public IPv4 address}
      WEBRTC_UDP_PORT: ${WEBRTC_UDP_PORT:-50000}
    depends_on:
      - postgres

volumes:
  evolution_postgres_local:
